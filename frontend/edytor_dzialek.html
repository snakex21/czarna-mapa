<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edytor Mapy Katastralnej</title>
  <link rel="icon" href="/location_favicon" type="image/x-icon">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="https://unpkg.com/@mapbox/mapbox-gl-draw@1.5.1/dist/mapbox-gl-draw.css">
  <script src="/assets/js/api.js"></script>
  <style>
    :root{--primary-gradient:linear-gradient(135deg,#667eea 0%,#764ba2 100%);--primary:#667eea;--danger:#f56565;--bg:#f7fafc;--card:#fff;--text:#2d3748;--muted:#718096;--border:#e2e8f0;--radius:12px;--shadow:0 10px 15px rgba(0,0,0,.1);--header:64px}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Inter,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
    .app-container{height:100%;display:flex;flex-direction:column}
    .top-bar{height:var(--header);background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;box-shadow:0 1px 3px rgba(0,0,0,.12);flex-shrink:0}
    .brand{display:flex;align-items:center;gap:12px}
    .brand i{font-size:1.5rem;background:var(--primary-gradient);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
    .brand h1{font-size:1.25rem}
    .controls{display:flex;gap:12px;align-items:center}
    .btn-secondary,.btn-danger,#toolbar button{padding:.6rem 1rem;border-radius:8px;border:1px solid var(--border);background:white;color:var(--text);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:.45rem}
    .btn-danger{background:var(--danger);color:white;border:none}
    #toolbar{background:var(--card);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;gap:16px;box-shadow:0 1px 3px rgba(0,0,0,.08);flex-shrink:0}
    #create-actions,#dynamic-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .toolbar-label{font-weight:700;color:var(--muted);margin-right:4px}
    #toolbar button[data-category]{border-radius:20px;color:white;border:2px solid transparent;text-shadow:0 1px 2px rgba(0,0,0,.25);min-width:auto}
    #toolbar button[data-category]:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
    #toolbar button[data-category].active{border-color:white;box-shadow:0 0 0 3px rgba(255,255,255,.4)}
    .main-content{flex:1;display:flex;overflow:hidden}
    #map{flex:1}
    #parcel-panel{width:340px;background:var(--card);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
    .sidebar-tabs{display:flex;border-bottom:1px solid var(--border)}
    .tab-btn{flex:1;padding:.75rem;background:transparent;border:none;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
    .tab-btn.active{color:var(--primary);border-bottom-color:var(--primary)}
    .search-container{padding:12px;border-bottom:1px solid var(--border)}
    .search-container input{width:100%;padding:.5rem .75rem;border:1px solid var(--border);border-radius:8px;font-size:.9rem}
    .list-container{flex:1;overflow-y:auto}
    #parcel-list{list-style:none;padding:8px}
    #parcel-list li{padding:10px 12px;border-radius:8px;margin-bottom:4px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:.15s;border:1px solid transparent}
    #parcel-list li:hover{background:#edf2ff}
    #parcel-list .parcel-info{display:flex;flex-direction:column}
    #parcel-list .parcel-id{font-weight:600}
    #parcel-list .parcel-category{font-size:.75rem;color:var(--muted);text-transform:capitalize}
    #parcel-list .parcel-actions{display:flex;gap:4px}
    #parcel-list .parcel-actions button{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:white;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.8rem}
    #parcel-list .parcel-actions button:hover{background:#f0f0f0}
    .main-controls{padding:12px;border-top:1px solid var(--border)}
    .main-controls button{width:100%}
    #status-message{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--card);padding:.75rem 1.5rem;border-radius:var(--radius);box-shadow:var(--shadow);font-weight:600;opacity:0;transition:.3s;pointer-events:none;z-index:1000}
    #status-message.show{opacity:1}
    .mapbox-gl-draw_ctrl-draw-btn{background-color:white!important}
    .layer-toggle-panel.maplibregl-ctrl-group{position:absolute!important;top:14px!important;right:14px!important;width:180px!important;min-width:0!important;max-width:none!important;padding:6px!important;display:flex!important;flex-direction:column!important;gap:5px!important;overflow:visible!important;background:rgba(255,255,255,.94)!important;border:1px solid rgba(203,213,225,.9)!important;border-radius:12px!important;box-shadow:0 8px 24px rgba(15,23,42,.16)!important;backdrop-filter:blur(10px);z-index:10}
    .layer-toggle-panel.maplibregl-ctrl-group .layer-toggle-btn{width:100%!important;height:34px!important;min-width:168px!important;padding:0 7px!important;display:grid!important;grid-template-columns:20px minmax(0,1fr) auto!important;align-items:center!important;gap:6px!important;border:0!important;border-radius:8px!important;background:transparent!important;color:#334155!important;font-family:Inter,system-ui,sans-serif!important;font-size:13px!important;font-weight:700!important;line-height:1!important;white-space:nowrap!important;text-align:left!important;overflow:visible!important;cursor:pointer}
    .layer-toggle-panel.maplibregl-ctrl-group .layer-toggle-btn:hover{background:#f1f5f9!important}
    .layer-toggle-panel.maplibregl-ctrl-group .layer-toggle-btn.active{background:rgba(102,126,234,.12)!important;color:#4f63d8!important}
    .layer-toggle-panel .layer-toggle-icon{font-size:18px!important;line-height:1!important}.layer-toggle-panel .layer-toggle-label{overflow:visible!important;text-overflow:clip!important}.layer-toggle-panel .toggle-indicator{justify-self:end!important;padding:3px 7px!important;border-radius:999px!important;font-size:11px!important;line-height:1!important;font-weight:800!important}.layer-toggle-panel .toggle-indicator.on{background:#22c55e!important;color:#fff!important}.layer-toggle-panel .toggle-indicator.off{background:#94a3b8!important;color:#fff!important}
    .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(5px);z-index:3000;align-items:center;justify-content:center}.modal.open{display:flex}.modal-card{position:relative;background:var(--card);border-radius:16px;width:90%;max-width:720px;max-height:80vh;overflow:hidden;box-shadow:0 20px 45px rgba(15,23,42,.22)}@media(min-width:1400px){.modal-card{max-width:860px}}.modal-head{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--border)}.modal-head h2{margin:0;font-size:1.25rem;display:flex;gap:10px;align-items:center}.modal-body{padding:20px 24px}.close-button{font-size:2rem;line-height:1;color:#94a3b8;background:none;border:0;cursor:pointer}.close-button:hover{color:var(--text)}#create-backup-btn{width:100%;padding:14px;border:0;border-radius:10px;background:#48bb78;color:#fff;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}#create-backup-btn:hover{background:#38a169}#backup-list-container{max-height:320px;overflow-y:auto;overflow-x:hidden;margin-top:16px}#backup-list{list-style:none;padding:0;margin:0}#backup-list li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;background:#f8fafc}#backup-list li>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.backup-actions{display:flex;gap:8px;flex-shrink:0}.backup-actions button{padding:8px 12px;border-radius:8px;border:0;color:#fff;font-weight:800;cursor:pointer}.backup-actions .btn-restore{background:#4299e1}.backup-actions .btn-delete{background:#f56565}
  </style>
</head>
<body>
<div class="app-container">
  <header class="top-bar">
    <div class="brand"><i class="fas fa-map-marked-alt"></i><h1>Edytor Mapy Katastralnej</h1></div>
    <div class="top-bar-info"><span id="currentDate"></span><span id="currentTime" style="margin-left:.5rem;font-weight:600"></span></div>
    <div class="controls"><button id="open-backup-manager" class="btn-secondary" type="button"><i class="fas fa-history"></i> Backupy</button><a class="btn-secondary" href="/index.html"><i class="fas fa-home"></i> Start</a><a class="btn-secondary" href="/mapa/mapa.html"><i class="fas fa-map"></i> Mapa</a></div>
  </header>
  <div id="toolbar">
    <div id="create-actions">
      <span class="toolbar-label"><i class="fas fa-plus-circle"></i> Nowy:</span>
      <button data-category="budowlana" style="background:#e67e22"><i class="fas fa-home"></i> Budowlana</button>
      <button data-category="rolna" style="background:#27ae60"><i class="fas fa-seedling"></i> Rolna</button>
      <button data-category="droga" style="background:#88540b"><i class="fas fa-road"></i> Droga</button>
      <button data-category="rzeka" style="background:#3498db"><i class="fas fa-water"></i> Rzeka</button>
      <button data-category="las" style="background:#16a085"><i class="fas fa-tree"></i> Las</button>
      <button data-category="pastwisko" style="background:#f1c40f;color:#333"><i class="fas fa-leaf"></i> Pastwisko</button>
      <button data-category="budynek" style="background:#9b59b6"><i class="fas fa-building"></i> Budynek</button>
      <button data-category="kapliczka" style="background:#e74c3c"><i class="fas fa-church"></i> Kapliczka</button>
    </div>
    <div id="dynamic-actions" style="display:none"></div>
    <div id="draw-actions" style="display:none;align-items:center;gap:8px">
      <button id="draw-undo-btn" class="btn-secondary" title="Cofnij ostatni punkt (Ctrl+Z)"><i class="fas fa-undo"></i> Cofnij punkt</button>
      <button id="draw-finish-btn" class="btn-secondary" title="Zakończ rysowanie"><i class="fas fa-check"></i> Zakończ</button>
      <button id="draw-cancel-btn" class="btn-secondary" title="Anuluj rysowanie"><i class="fas fa-times"></i> Anuluj</button>
    </div>
  </div>
  <main class="main-content">
    <div id="map"></div>
    <aside id="parcel-panel">
      <div class="sidebar-tabs">
        <button class="tab-btn active" data-tab="parcels"><i class="fas fa-th-list"></i> Działki</button>
        <button class="tab-btn" data-tab="others"><i class="fas fa-layer-group"></i> Inne</button>
      </div>
      <div class="search-container"><input type="search" id="search-filter" placeholder="Szukaj działki..." autocomplete="off"></div>
      <div class="list-container"><ul id="parcel-list"></ul></div>
      <div class="main-controls"><button id="delete-all-parcels-btn" class="btn-danger"><i class="fas fa-trash-alt"></i> Usuń Wszystkie Obiekty</button></div>
    </aside>
  </main>
</div>
<div id="status-message"></div>
<div class="modal" id="backupModal">
  <div class="modal-card">
    <div class="modal-head"><h2><i class="fas fa-history"></i> Kopie Zapasowe</h2><button class="close-button" id="closeBackupModal" aria-label="Zamknij">&times;</button></div>
    <div class="modal-body">
      <button id="create-backup-btn"><i class="fas fa-plus-circle"></i> Utwórz Nową Kopię</button>
      <h3 style="margin:24px 0 10px;color:var(--muted)">Dostępne kopie:</h3>
      <div id="backup-list-container"><ul id="backup-list"><li><span>Ładowanie...</span></li></ul></div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@mapbox/mapbox-gl-draw@1.5.1/dist/mapbox-gl-draw.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const STYLES = {
    budowlana:   '#e67e22', rolna: '#27ae60', droga: '#8B4513', rzeka: '#3498db',
    las:         '#1abc9c', pastwisko: '#f1c40f', budynek: '#e67e22', kapliczka: '#9b59b6',
    obrys_miejscowosci: '#ff0000', obiekt_specjalny: '#2c3e50', default: '#3388ff',
  };
  const POINT_CATS = new Set(['budynek','kapliczka','obiekt_specjalny']);
  const LINE_CATS  = new Set(['droga','rzeka']);
  const CATEGORY_OPTIONS = [
    { value:'budowlana', label:'Budowlana', kind:'polygon' },
    { value:'rolna', label:'Rolna', kind:'polygon' },
    { value:'las', label:'Las', kind:'polygon' },
    { value:'pastwisko', label:'Pastwisko', kind:'polygon' },
    { value:'obrys_miejscowosci', label:'Obrys miejscowości', kind:'polygon' },
    { value:'droga', label:'Droga', kind:'line' },
    { value:'rzeka', label:'Rzeka', kind:'line' },
    { value:'budynek', label:'Budynek', kind:'point' },
    { value:'kapliczka', label:'Kapliczka', kind:'point' },
    { value:'obiekt_specjalny', label:'Obiekt specjalny', kind:'point' },
  ];

  const $ = id => document.getElementById(id);
  let map, draw, allFeatures = {}, activeTab = 'parcels', drawingCategory = null;
  let editingObjectId = null, editingDrawFeatureId = null;

  // ---- Zegar ----
  function tick() {
    const n = new Date();
    $('currentDate').textContent = n.toLocaleDateString('pl-PL', {weekday:'long',year:'numeric',month:'long',day:'numeric'});
    $('currentTime').textContent = n.toLocaleTimeString('pl-PL', {hour:'2-digit',minute:'2-digit'});
  }
  tick(); setInterval(tick, 1000);
  function status(msg) {
    const el = $('status-message');
    el.textContent = msg || 'Gotowe'; el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2200);
  }
  function clearDraftPreview() {
    try { map.getSource('draft-edit-preview')?.setData({ type:'FeatureCollection', features:[] }); } catch {}
  }
  function dispId(f) { return f.properties?.numer_obiektu || (f.id ? String(f.id) : '?'); }
  function colorFor(cat) { return STYLES[cat] || STYLES.default; }
  function geometryKind(g) {
    if (!g) return null;
    if (g.type === 'Point' || g.type === 'MultiPoint') return 'point';
    if (g.type === 'LineString' || g.type === 'MultiLineString') return 'line';
    if (g.type === 'Polygon' || g.type === 'MultiPolygon') return 'polygon';
    return null;
  }

  // ---- Rysowanie warstw GeoJSON ----
  function styleFill(feature) {
    const cat = feature.properties.kategoria;
    if (LINE_CATS.has(cat)) return null; // linie rysujemy osobno
    const c = colorFor(cat);
    const isOutline = cat === 'obrys_miejscowosci';
    return { 'fill-color': c, 'fill-opacity': isOutline ? 0.04 : (['las','pastwisko'].includes(cat) ? 0.5 : 0.35), 'fill-outline-color': c };
  }
  function styleLine(feature) {
    const cat = feature.properties.kategoria;
    if (LINE_CATS.has(cat)) return { 'line-color': colorFor(cat), 'line-width': cat === 'rzeka' ? 4 : 3, 'line-opacity': 1 };
    return { 'line-color': colorFor(cat), 'line-width': 2, 'line-opacity': 1 };
  }

  // ---- Ładowanie danych ----
  async function load() {
    const fc = await API._invoke('api_dzialki');
    allFeatures = {};
    const features = fc.features || [];
    for (const f of features) allFeatures[f.id] = f;

    // GeoJSON dla MapLibre — NIE używamy promoteId, id jest na top-level
    const geojson = { type: 'FeatureCollection', features: features.map(f => ({
      type: 'Feature',
      id: f.id,
      geometry: f.geometry,
      properties: f.properties,
    })) };

    if (draw) draw.deleteAll();
    if (map.getSource('parcels')) {
      map.getSource('parcels').setData(geojson);
    }
    renderList();
  }

  function renderList() {
    const q = ($('search-filter').value || '').toLowerCase();
    const isParcel = c => ['rolna','budowlana'].includes(c);
    const filtered = Object.values(allFeatures)
      .filter(f => (activeTab === 'parcels') === isParcel(f.properties.kategoria))
      .filter(f => `${dispId(f)} ${f.properties.kategoria}`.toLowerCase().includes(q || ''))
      .sort((a,b) => String(dispId(a)).localeCompare(String(dispId(b)), undefined, {numeric:true}));

    $('parcel-list').innerHTML = filtered.map(f => {
      const cat = (f.properties.kategoria || '').replace(/_/g, ' ');
      return `<li data-id="${f.id}">
        <div class="parcel-info"><span class="parcel-id">${dispId(f)}</span><span class="parcel-category">${cat}</span></div>
        <div class="parcel-actions">
          <button data-act="edit" title="Edytuj geometrię">✏️</button>
          <button data-act="rename" title="Zmień nazwę">🏷️</button>
          <button data-act="type" title="Zmień typ">🔄</button>
          <button data-act="delete" title="Usuń">❌</button>
        </div>
      </li>`;
    }).join('');
  }

  // ---- Inicjalizacja MapLibre GL ----
  const cfg = await API._invoke('pobierz_konfiguracje_mapy');
  const cal = typeof cfg.calibration === 'string' ? JSON.parse(cfg.calibration) : cfg.calibration;
  const def = typeof cfg.defaults === 'string' ? JSON.parse(cfg.defaults) : cfg.defaults;

  const latPad = (cal.ne.lat - cal.sw.lat) * 0.5;
  const lngPad = (cal.ne.lng - cal.sw.lng) * 0.8;

  map = new maplibregl.Map({
    container: 'map',
    style: {
      version: 8,
      glyphs: 'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf',
      sources: {
        osm: { type: 'raster', tiles: ['https://a.tile.openstreetmap.org/{z}/{x}/{y}.png'], tileSize: 256, maxzoom: 19 },
        historical: { type: 'image', url: '/mapa/mapa.jpg', coordinates: [[cal.sw.lng,cal.ne.lat],[cal.ne.lng,cal.ne.lat],[cal.ne.lng,cal.sw.lat],[cal.sw.lng,cal.sw.lat]] }
      },
      layers: [
        { id: 'osm-layer', type: 'raster', source: 'osm', paint: { 'raster-opacity': 0.45 } },
        { id: 'historical-layer', type: 'raster', source: 'historical' }
      ]
    },
    center: [def.center.lng, def.center.lat],
    zoom: def.zoom,
    minZoom: 12, maxZoom: 22,
    maxBounds: [[cal.sw.lng-lngPad,cal.sw.lat-latPad],[cal.ne.lng+lngPad,cal.ne.lat+latPad]],
    attributionControl: false,
    renderWorldCopies: false,
  });
  map.addControl(new maplibregl.NavigationControl(), 'top-left');

  const osmVisibility = { visible: true };
  const histVisibility = { visible: true };
  const layerToggle = document.createElement('div');
  layerToggle.className = 'maplibregl-ctrl maplibregl-ctrl-group layer-toggle-panel';
  layerToggle.innerHTML = `
    <button id="toggle-osm" class="layer-toggle-btn active" title="Mapa drogowa (OSM)">
      <span class="layer-toggle-icon">🗺️</span><span class="layer-toggle-label">OSM</span><span class="toggle-indicator on">ON</span>
    </button>
    <button id="toggle-hist" class="layer-toggle-btn active" title="Mapa historyczna">
      <span class="layer-toggle-icon">📜</span><span class="layer-toggle-label">Historyczna</span><span class="toggle-indicator on">ON</span>
    </button>`;
  map.getContainer().appendChild(layerToggle);
  function updateLayerToggleButton(btn, visible) {
    btn.classList.toggle('active', visible);
    const indicator = btn.querySelector('.toggle-indicator');
    indicator.textContent = visible ? 'ON' : 'OFF';
    indicator.className = `toggle-indicator ${visible ? 'on' : 'off'}`;
  }
  $('toggle-osm')?.addEventListener('click', function () {
    osmVisibility.visible = !osmVisibility.visible;
    if (map.getLayer('osm-layer')) map.setLayoutProperty('osm-layer', 'visibility', osmVisibility.visible ? 'visible' : 'none');
    updateLayerToggleButton(this, osmVisibility.visible);
  });
  $('toggle-hist')?.addEventListener('click', function () {
    histVisibility.visible = !histVisibility.visible;
    if (map.getLayer('historical-layer')) map.setLayoutProperty('historical-layer', 'visibility', histVisibility.visible ? 'visible' : 'none');
    updateLayerToggleButton(this, histVisibility.visible);
  });

  // mapbox-gl-draw — wygląd jak stary Geoman/Leaflet, ale na MapLibre/WebGL:
  // roboczo rysujemy tylko fioletową linię + fioletowe wierzchołki. Bez fill/obrysu.
  const DRAW_COLOR = '#9b59b6';
  const fixedStyles = [
    // Poligon roboczy: brak wypełnienia, żeby nie robił się brzydki trójkąt.
    { id:'gl-draw-polygon-fill-inactive', type:'fill', filter:['all',['==','active','false'],['==','$type','Polygon'],['!=','mode','static']], paint:{'fill-color':DRAW_COLOR,'fill-opacity':0} },
    { id:'gl-draw-polygon-fill-active', type:'fill', filter:['all',['==','active','true'],['==','$type','Polygon']], paint:{'fill-color':DRAW_COLOR,'fill-opacity':0} },
    // Granica poligonu i linia robocza — jedna prosta fioletowa kreska.
    { id:'gl-draw-polygon-stroke-inactive', type:'line', filter:['all',['==','active','false'],['==','$type','Polygon'],['!=','mode','static']], layout:{'line-cap':'round','line-join':'round'}, paint:{'line-color':DRAW_COLOR,'line-width':2.5,'line-opacity':1} },
    { id:'gl-draw-polygon-stroke-active', type:'line', filter:['all',['==','active','true'],['==','$type','Polygon']], layout:{'line-cap':'round','line-join':'round'}, paint:{'line-color':DRAW_COLOR,'line-width':2.5,'line-opacity':1} },
    { id:'gl-draw-line-inactive', type:'line', filter:['all',['==','active','false'],['==','$type','LineString'],['!=','mode','static']], layout:{'line-cap':'round','line-join':'round'}, paint:{'line-color':DRAW_COLOR,'line-width':2.5,'line-opacity':1} },
    { id:'gl-draw-line-active', type:'line', filter:['all',['==','active','true'],['==','$type','LineString']], layout:{'line-cap':'round','line-join':'round'}, paint:{'line-color':DRAW_COLOR,'line-width':2.5,'line-opacity':1} },
    // Punkty i wierzchołki.
    { id:'gl-draw-point-stroke-inactive', type:'circle', filter:['all',['==','active','false'],['==','$type','Point'],['==','meta','feature'],['!=','mode','static']], paint:{'circle-radius':6,'circle-color':'#fff'} },
    { id:'gl-draw-point-inactive', type:'circle', filter:['all',['==','active','false'],['==','$type','Point'],['==','meta','feature'],['!=','mode','static']], paint:{'circle-radius':4,'circle-color':DRAW_COLOR} },
    { id:'gl-draw-point-stroke-active', type:'circle', filter:['all',['==','$type','Point'],['==','active','true'],['!=','meta','midpoint']], paint:{'circle-radius':7,'circle-color':'#fff'} },
    { id:'gl-draw-point-active', type:'circle', filter:['all',['==','$type','Point'],['!=','meta','midpoint'],['==','active','true']], paint:{'circle-radius':5,'circle-color':DRAW_COLOR} },
    { id:'gl-draw-vertex-stroke', type:'circle', filter:['all',['==','meta','vertex'],['==','$type','Point'],['!=','mode','static']], paint:{'circle-radius':6,'circle-color':'#fff'} },
    { id:'gl-draw-vertex', type:'circle', filter:['all',['==','meta','vertex'],['==','$type','Point'],['!=','mode','static']], paint:{'circle-radius':4,'circle-color':DRAW_COLOR} },
    { id:'gl-draw-midpoint', type:'circle', filter:['all',['==','meta','midpoint'],['==','$type','Point']], paint:{'circle-radius':4,'circle-color':'#d8b4fe'} },
  ];

  const drawModes = { ...MapboxDraw.modes };
  // Lista uchwytów do przeciągania — wypełniana przez toDisplayFeatures
  let draftVertices = [];
  // Referencja do żywego obiektu Feature z aktywnego trybu rysowania.
  // Uwaga: draw.get(id) zwraca zwykły GeoJSON bez metod updateCoordinate(),
  // dlatego przy przeciąganiu punktu w trakcie dodawania musimy trzymać
  // stan przekazany do toDisplayFeatures (state.polygon / state.line).
  let activeDraftFeature = null;
  let draftGeometryOverride = null;
  // Domyślne draw.trash() w mapbox-gl-draw 1.5 anuluje cały szkic w trybie
  // rysowania. Nadpisujemy tylko zachowanie kosza/undo tak, żeby usuwał
  // ostatni faktycznie kliknięty wierzchołek i pozwalał rysować dalej.
  // Dodatkowo w trakcie rysowania pokazujemy wszystkie już kliknięte punkty
  // jako uchwyty, które można złapać myszką i przesunąć przed zapisaniem obiektu.
  drawModes.draw_polygon = {
    ...MapboxDraw.modes.draw_polygon,
    onTrash(state) {
      const count = draftVertices.filter(v => v.parent === state.polygon.id).length || state.currentVertexPosition || 0;
      if (count <= 1) {
        this.deleteFeature([state.polygon.id], { silent: true });
        this.changeMode('simple_select');
        return;
      }
      // Usuń tylko ostatni faktycznie kliknięty wierzchołek. Przy 2 punktach
      // ma zostać 1 punkt, a nie znikać cały szkic.
      state.polygon.removeCoordinate(`0.${count - 1}`);
      state.currentVertexPosition = count - 1;
      activeDraftFeature = { id: state.polygon.id, feature: state.polygon, state, kind: 'polygon' };
      try { window._syncDraftPreviewFromDraw?.(); } catch {}
    },
    toDisplayFeatures(state, geojson, display) {
      MapboxDraw.modes.draw_polygon.toDisplayFeatures.call(this, state, geojson, display);
      if (geojson.properties.id !== state.polygon.id) return;
      activeDraftFeature = { id: state.polygon.id, feature: state.polygon, state, kind: 'polygon' };
      const ring = state.polygon.coordinates?.[0] || [];
      draftVertices = [];
      for (let i = 0; i < state.currentVertexPosition; i++) {
        if (ring[i]) {
          const v = { type:'Feature', properties:{ meta:'vertex', parent:state.polygon.id, coord_path:`0.${i}`, active:'false' }, geometry:{ type:'Point', coordinates:ring[i] } };
          display(v);
          draftVertices.push({ parent: state.polygon.id, path: `0.${i}`, lng: ring[i][0], lat: ring[i][1] });
        }
      }
      // Odśwież uchwyty HTML
      try { window._refreshDraftHandles?.(); } catch {}
    }
  };
  drawModes.draw_line_string = {
    ...MapboxDraw.modes.draw_line_string,
    onTrash(state) {
      const count = draftVertices.filter(v => v.parent === state.line.id).length || state.currentVertexPosition || 0;
      if (count <= 1) {
        this.deleteFeature([state.line.id], { silent: true });
        this.changeMode('simple_select');
        return;
      }
      // Usuń tylko ostatni faktycznie kliknięty wierzchołek. Przy 2 punktach
      // ma zostać 1 punkt, a nie znikać cały szkic.
      state.line.removeCoordinate(`${count - 1}`);
      state.currentVertexPosition = count - 1;
      activeDraftFeature = { id: state.line.id, feature: state.line, state, kind: 'line' };
      try { window._syncDraftPreviewFromDraw?.(); } catch {}
    },
    toDisplayFeatures(state, geojson, display) {
      MapboxDraw.modes.draw_line_string.toDisplayFeatures.call(this, state, geojson, display);
      if (geojson.properties.id !== state.line.id) return;
      activeDraftFeature = { id: state.line.id, feature: state.line, state, kind: 'line' };
      const coords = state.line.coordinates || [];
      draftVertices = [];
      for (let i = 0; i < state.currentVertexPosition; i++) {
        if (coords[i]) {
          const v = { type:'Feature', properties:{ meta:'vertex', parent:state.line.id, coord_path:`${i}`, active:'false' }, geometry:{ type:'Point', coordinates:coords[i] } };
          display(v);
          draftVertices.push({ parent: state.line.id, path: `${i}`, lng: coords[i][0], lat: coords[i][1] });
        }
      }
      try { window._refreshDraftHandles?.(); } catch {}
    }
  };
  draw = new MapboxDraw({
    displayControlsDefault: false,
    // Nie pokazujemy bocznych kontrolek Draw — użytkownik korzysta z naszych kolorowych przycisków kategorii.
    controls: { point: false, line_string: false, polygon: false, trash: false, combine_features: false, uncombine_features: false },
    modes: drawModes,
    styles: fixedStyles,
    clickBuffer: 10,
    touchBuffer: 18,
    defaultMode: 'simple_select',
  });
  map.addControl(draw, 'top-left');

  // ---- Przeciąganie uchwytów podczas rysowania (Canvas DOM) ----
  (function setupDraftVertexDrag() {
    let dragPath = null, dragFeatureId = null, moveCount = 0;
    let dragPointerId = null;
    const canvas = map.getCanvas();

    function forceDrawRender(featureId) {
      // MapboxDraw nie ma publicznego API do odświeżenia aktywnego szkicu,
      // ale jego store udostępnia render(). Jeśli API się zmieni, błąd ignorujemy
      // — HTML-owe uchwyty nadal zostaną odświeżone.
      try { draw._ctx.store.featureChanged(featureId); } catch {}
      try { draw._ctx.store.render(); } catch {}
    }

    function updateDraftCoordinate(featureId, path, lng, lat) {
      let updated = false;

      // Najważniejsza ścieżka: żywy Feature z aktualnego trybu rysowania.
      // To faktycznie zmienia współrzędne zapisywane po kliknięciu „Zakończ”.
      const live = activeDraftFeature && activeDraftFeature.id === featureId ? activeDraftFeature.feature : null;
      if (live && typeof live.updateCoordinate === 'function') {
        live.updateCoordinate(path, lng, lat);
        updated = true;
      }

      // Awaryjnie spróbuj przez wewnętrzny store MapboxDraw.
      if (!updated) {
        try {
          const stored = draw._ctx.store.get(featureId);
          if (stored && typeof stored.updateCoordinate === 'function') {
            stored.updateCoordinate(path, lng, lat);
            updated = true;
          }
        } catch {}
      }

      if (updated) forceDrawRender(featureId);
      return updated;
    }

    function setCoordinateInGeometry(geometry, path, lng, lat) {
      if (!geometry) return null;
      const clone = JSON.parse(JSON.stringify(geometry));
      const parts = String(path).split('.').map(n => Number(n));
      if (clone.type === 'LineString') {
        const i = parts[0];
        if (Number.isFinite(i) && clone.coordinates?.[i]) clone.coordinates[i] = [lng, lat];
      } else if (clone.type === 'Polygon') {
        const ringIdx = parts.length > 1 ? parts[0] : 0;
        const i = parts.length > 1 ? parts[1] : parts[0];
        if (Number.isFinite(i) && clone.coordinates?.[ringIdx]?.[i]) {
          clone.coordinates[ringIdx][i] = [lng, lat];
          // Dla domkniętego poligonu pierwszy i ostatni punkt muszą być takie same.
          if (i === 0 && clone.coordinates[ringIdx].length > 1) {
            clone.coordinates[ringIdx][clone.coordinates[ringIdx].length - 1] = [lng, lat];
          }
        }
      }
      return clone;
    }

    function refreshDraftPreview() {
      const src = map.getSource('draft-edit-preview');
      if (!src || !draftGeometryOverride) return;
      src.setData({ type:'FeatureCollection', features:[{ type:'Feature', properties:{}, geometry:draftGeometryOverride }] });
    }

    function geometryFromActiveDraft() {
      if (!activeDraftFeature?.feature) return null;
      const pos = activeDraftFeature.state?.currentVertexPosition;
      if (activeDraftFeature.kind === 'line') {
        const coords = (activeDraftFeature.feature.coordinates || [])
          .slice(0, Number.isFinite(pos) ? pos : undefined)
          .map(c => [c[0], c[1]]);
        return coords.length ? { type:'LineString', coordinates: coords } : null;
      }
      if (activeDraftFeature.kind === 'polygon') {
        const ring = (activeDraftFeature.feature.coordinates?.[0] || [])
          .slice(0, Number.isFinite(pos) ? pos : undefined)
          .map(c => [c[0], c[1]]);
        if (!ring.length) return null;
        if (ring.length > 2) ring.push([ring[0][0], ring[0][1]]);
        return { type:'Polygon', coordinates:[ring] };
      }
      return null;
    }

    window._syncDraftPreviewFromDraw = function() {
      draftGeometryOverride = geometryFromActiveDraft();
      if (draftGeometryOverride) refreshDraftPreview();
      else clearDraftPreview();
      try { window._refreshDraftHandles?.(); } catch {}
    };

    function swallow(ev) {
      ev?.preventDefault?.();
      ev?.stopPropagation?.();
      ev?.stopImmediatePropagation?.();
    }

    function canvasCoords(ev) {
      const container = document.getElementById('map');
      const rect = container.getBoundingClientRect();
      return { x: ev.clientX - rect.left, y: ev.clientY - rect.top };
    }

    function findNearestVertex(cx, cy) {
      let best = null, bestDist = 30;
      for (const v of draftVertices) {
        const pt = map.project([v.lng, v.lat]);
        if (!pt) continue;
        const dx = pt.x - cx, dy = pt.y - cy;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < bestDist) { bestDist = dist; best = v; }
      }
      return best;
    }

    function beginDrag(ev) {
      if (ev.button != null && ev.button !== 0) return;
      if (!drawingCategory) return;
      const mode = draw.getMode();
      if (mode !== 'draw_polygon' && mode !== 'draw_line_string') return;
      const coords = canvasCoords(ev);
      const hit = findNearestVertex(coords.x, coords.y);
      if (!hit) return;
      swallow(ev);
      dragPath = hit.path;
      dragFeatureId = hit.parent;
      dragPointerId = ev.pointerId ?? null;
      moveCount = 0;
      map.dragPan.disable();
      try { if (ev.pointerId != null) canvas.setPointerCapture(ev.pointerId); } catch {}
      canvas.style.cursor = 'grabbing';
    }

    function moveDrag(ev) {
      if (!dragPath || !dragFeatureId) return;
      swallow(ev);
      moveCount++;
      const coords = canvasCoords(ev);
      const lngLat = map.unproject([coords.x, coords.y]);
      // Aktualizuj wewnętrzny model MapboxDraw. Nie używamy draw.get(), bo
      // zwraca kopię GeoJSON bez updateCoordinate(), przez co wcześniej punkt
      // wyglądał jak przeciągany, ale geometria zostawała w starym miejscu.
      updateDraftCoordinate(dragFeatureId, dragPath, lngLat.lng, lngLat.lat);
      const currentGeometry = geometryFromActiveDraft() || activeDraftFeature?.feature?.toGeoJSON?.()?.geometry || draw.get(dragFeatureId)?.geometry || draftGeometryOverride;
      draftGeometryOverride = setCoordinateInGeometry(currentGeometry, dragPath, lngLat.lng, lngLat.lat) || draftGeometryOverride;
      // Aktualizuj naszą tablicę
      const dv = draftVertices.find(v => v.parent === dragFeatureId && v.path === dragPath);
      if (dv) { dv.lng = lngLat.lng; dv.lat = lngLat.lat; }
      refreshDraftPreview();
      // Natychmiastowe odświeżenie wizualne (HTML)
      try { window._refreshDraftHandles?.(); } catch {}
      if (moveCount % 15 === 0) status(`Punkt: ${lngLat.lng.toFixed(5)}, ${lngLat.lat.toFixed(5)}`);
    }

    function stopDrag(ev) {
      if (!dragPath) return;
      swallow(ev);
      try { if (dragPointerId != null) canvas.releasePointerCapture(dragPointerId); } catch {}
      dragPath = null;
      dragFeatureId = null;
      dragPointerId = null;
      moveCount = 0;
      map.dragPan.enable();
      canvas.style.cursor = '';
    }

    // MapboxDraw/MapLibre w zależności od WebView używa mouse albo pointer events.
    // Obsługujemy oba typy i blokujemy je w fazie capture, żeby zachowanie było
    // takie jak przy przesuwaniu węzłów istniejącej działki: mapa nie dodaje
    // w tym czasie kolejnego punktu i nie przechwytuje przeciągania.
    canvas.addEventListener('pointerdown', beginDrag, {capture: true, passive: false});
    canvas.addEventListener('pointermove', moveDrag, {capture: true, passive: false});
    canvas.addEventListener('pointerup', stopDrag, {capture: true});
    canvas.addEventListener('pointercancel', stopDrag, {capture: true});
    canvas.addEventListener('pointerleave', stopDrag, {capture: true});

    canvas.addEventListener('mousedown', beginDrag, {capture: true, passive: false});
    window.addEventListener('mousemove', moveDrag, {capture: true, passive: false});
    window.addEventListener('mouseup', stopDrag, {capture: true, passive: false});
  })();

  // Dodajemy source + warstwy po załadowaniu stylu
  map.on('style.load', () => {
    map.addSource('parcels', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
    map.addSource('draft-edit-preview', { type: 'geojson', data: { type:'FeatureCollection', features:[] } });

    map.addLayer({ id: 'parcels-fill', type: 'fill', source: 'parcels',
      filter: ['!', ['match', ['get','kategoria'], ['droga','rzeka'], true, false]],
      paint: { 'fill-color': ['get','_color'], 'fill-opacity': ['get','_fillOpacity'], 'fill-outline-color': ['get','_color'] }
    });
    map.addLayer({ id: 'parcels-line', type: 'line', source: 'parcels',
      paint: { 'line-color': ['get','_color'], 'line-width': ['get','_lineWidth'], 'line-opacity': 1 }
    });
    map.addLayer({ id: 'parcels-labels', type: 'symbol', source: 'parcels',
      layout: { 'text-field': ['get','numer_obiektu'], 'text-size': 12, 'text-allow-overlap': true, 'text-ignore-placement': true, 'symbol-placement': 'point', 'text-anchor': 'center' },
      paint: { 'text-color': '#ffffff', 'text-halo-color': '#000000', 'text-halo-width': 1.5 }
    });
    // Osobny podgląd szkicu po przeciągnięciu punktu podczas dodawania.
    // Dzięki temu zachowuje się wizualnie jak edycja istniejącej działki: widać
    // aktualną geometrię dokładnie tam, gdzie puszczony jest punkt.
    map.addLayer({ id:'draft-edit-preview-fill', type:'fill', source:'draft-edit-preview',
      filter:['==', ['geometry-type'], 'Polygon'],
      paint:{ 'fill-color':DRAW_COLOR, 'fill-opacity':0.08 }
    });
    map.addLayer({ id:'draft-edit-preview-line', type:'line', source:'draft-edit-preview',
      paint:{ 'line-color':'#ff00ff', 'line-width':3.5, 'line-opacity':1 }
    });

    load().then(() => {
      map.fitBounds([[cal.sw.lng,cal.sw.lat],[cal.ne.lng,cal.ne.lat]], { padding: 40 });
    });

    // Kontener na uchwyty HTML (pozycjonowane absolutnie nad mapą)
    const handleBox = document.createElement('div');
    handleBox.id = 'draft-handles';
    handleBox.style.cssText = 'position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:999;overflow:hidden';
    map.getContainer().appendChild(handleBox);

    // Funkcja odświeżająca uchwyty HTML
    window._refreshDraftHandles = function() {
      handleBox.innerHTML = '';
      const svgNS = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(svgNS, 'svg');
      svg.setAttribute('width', '100%');
      svg.setAttribute('height', '100%');
      svg.style.cssText = 'position:absolute;inset:0;overflow:visible;pointer-events:none';

      function projectCoords(coords) {
        return (coords || []).map(c => {
          const pt = map.project(c);
          return pt ? `${pt.x},${pt.y}` : null;
        }).filter(Boolean).join(' ');
      }

      // Rysujemy własną linię/poligon nad MapboxDraw. To rozwiązuje przypadek,
      // w którym punkt HTML przesuwa się poprawnie, ale wewnętrzna warstwa draw
      // nie odświeża odcinka podczas aktywnego dodawania działki.
      const previewGeom = draftGeometryOverride;
      if (previewGeom?.type === 'LineString' && previewGeom.coordinates?.length > 1) {
        const line = document.createElementNS(svgNS, 'polyline');
        line.setAttribute('points', projectCoords(previewGeom.coordinates));
        line.setAttribute('fill', 'none');
        line.setAttribute('stroke', '#ff00ff');
        line.setAttribute('stroke-width', '4');
        line.setAttribute('stroke-linecap', 'round');
        line.setAttribute('stroke-linejoin', 'round');
        line.setAttribute('filter', 'drop-shadow(0 1px 2px rgba(0,0,0,.35))');
        svg.appendChild(line);
      } else if (previewGeom?.type === 'Polygon' && previewGeom.coordinates?.[0]?.length > 1) {
        const ring = previewGeom.coordinates[0] || [];
        const shape = document.createElementNS(svgNS, ring.length > 3 ? 'polygon' : 'polyline');
        shape.setAttribute('points', projectCoords(ring));
        shape.setAttribute('fill', ring.length > 3 ? 'rgba(255,0,255,.08)' : 'none');
        shape.setAttribute('stroke', '#ff00ff');
        shape.setAttribute('stroke-width', '4');
        shape.setAttribute('stroke-linejoin', 'round');
        shape.setAttribute('stroke-linecap', 'round');
        shape.setAttribute('filter', 'drop-shadow(0 1px 2px rgba(0,0,0,.35))');
        svg.appendChild(shape);
      }

      if (svg.childNodes.length) handleBox.appendChild(svg);
      for (const v of draftVertices) {
        const pt = map.project([v.lng, v.lat]);
        if (!pt) continue;
        const d = document.createElement('div');
        d.style.cssText = `position:absolute;left:${pt.x-9}px;top:${pt.y-9}px;width:18px;height:18px;border-radius:50%;background:#ff00ff;border:3px solid white;box-shadow:0 0 4px rgba(0,0,0,.5)`;
        handleBox.appendChild(d);
      }
    };
    window._clearDraftHandles = function() { handleBox.innerHTML = ''; };

    // Przerysowuj uchwyty przy każdej zmianie widoku mapy
    map.on('move', () => { try { window._refreshDraftHandles(); } catch {} });
  });

  // ---- Rysowanie ----
  function startDraw(cat) {
    editingObjectId = null;
    editingDrawFeatureId = null;
    $('dynamic-actions').style.display = 'none';
    drawingCategory = cat;
    activeDraftFeature = null;
    draftGeometryOverride = null;
    clearDraftPreview();
    document.querySelectorAll('[data-category]').forEach(b => b.classList.toggle('active', b.dataset.category === cat));
    const mode = POINT_CATS.has(cat) ? 'draw_point' : LINE_CATS.has(cat) ? 'draw_line_string' : 'draw_polygon';
    draw.changeMode(mode);
    $('draw-actions').style.display = 'flex';
    status(`Rysowanie: ${cat}. Punkty możesz przesuwać: złap punkt myszką i przeciągnij.`);
  }

  function dispatchDrawKey(key, code, keyCode) {
    try {
      const events = [
        new KeyboardEvent('keydown', { key, code, keyCode, which:keyCode, bubbles:true, cancelable:true }),
        new KeyboardEvent('keyup',   { key, code, keyCode, which:keyCode, bubbles:true, cancelable:true }),
      ];
      for (const ev of events) {
        map.getCanvas().dispatchEvent(ev);
        document.dispatchEvent(ev);
        window.dispatchEvent(ev);
      }
    } catch {}
  }

  function undoLastDrawPoint() {
    if (!draw || !drawingCategory) return;
    const mode = typeof draw.getMode === 'function' ? draw.getMode() : '';
    if (!String(mode).startsWith('draw_')) {
      status('Cofanie punktu działa tylko podczas rysowania');
      return;
    }

    // W aktywnych trybach draw_polygon/draw_line_string MapboxDraw.trash()
    // usuwa ostatnio dodany wierzchołek. Sztuczny Backspace bywa ignorowany
    // przez WebView/MapLibre, dlatego API draw jest główną ścieżką.
    try {
      const wasPoint = POINT_CATS.has(drawingCategory);
      draw.trash();
      // Po cofnięciu usuń stary podgląd odcinka do cofniętego wierzchołka.
      // Bez tego punkt znikał, ale nasza warstwa podglądu nadal rysowała
      // poprzedni trójkąt/odcinek.
      try { window._syncDraftPreviewFromDraw?.(); } catch {}
      const newMode = typeof draw.getMode === 'function' ? draw.getMode() : mode;
      const stillDrawing = String(newMode).startsWith('draw_');
      if (!String(newMode).startsWith('draw_')) {
        drawingCategory = null;
        clearDrawBtns();
        $('draw-actions').style.display = 'none';
      }
      status(wasPoint || !stillDrawing ? 'Anulowano ostatni punkt' : 'Cofnięto ostatni punkt');
    } catch (err) {
      dispatchDrawKey('Backspace', 'Backspace', 8);
      status('Nie udało się cofnąć punktu');
    }
  }

  // Przyciski podczas rysowania
  $('draw-undo-btn').onclick = undoLastDrawPoint;

  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && drawingCategory) {
      e.preventDefault();
      undoLastDrawPoint();
    }
  });
  $('draw-finish-btn').onclick = () => {
    try {
      // MapboxDraw kończy linię/poligon po Enter. Wysyłamy event do canvasa i dokumentu,
      // bo różne wersje draw nasłuchują w różnych miejscach.
      dispatchDrawKey('Enter', 'Enter', 13);
    } catch {}
  };
  $('draw-cancel-btn').onclick = () => {
    // Anuluj ma skasować cały szkic, nie tylko ostatni punkt.
    try { draw.deleteAll(); } catch {}
    try { draw.changeMode('simple_select'); } catch {}
    drawingCategory = null;
    draftVertices = [];
    activeDraftFeature = null;
    draftGeometryOverride = null;
    try { window._clearDraftHandles?.(); } catch {}
    clearDraftPreview();
    clearDrawBtns();
    $('draw-actions').style.display = 'none';
    status('Anulowano rysowanie');
  };
  document.querySelectorAll('[data-category]').forEach(b => { b.onclick = () => startDraw(b.dataset.category); });

  function clearDrawBtns() {
    document.querySelectorAll('[data-category]').forEach(b => b.classList.remove('active'));
  }

  map.on('draw.create', async (e) => {
    $('draw-actions').style.display = 'none';
    draftVertices = [];
    activeDraftFeature = null;
    const geometryOverride = draftGeometryOverride ? JSON.parse(JSON.stringify(draftGeometryOverride)) : null;
    draftGeometryOverride = null;
    try { window._clearDraftHandles?.(); } catch {}
    clearDraftPreview();
    let createdId = null;
    for (const f of e.features) {
      const name = prompt(`Podaj numer/nazwę obiektu (${drawingCategory || '?'}):`);
      if (!name) { draw.delete(f.id); continue; }
      try {
        const geometryToSave = geometryOverride && geometryOverride.type === f.geometry?.type ? geometryOverride : f.geometry;
        const res = await API._invoke('edytor_dzialek_dodaj_obiekt', { nazwa: name.trim(), kategoria: drawingCategory, geometria: geometryToSave });
        createdId = Number(res?.id || 0) || null;
        status('Dodano obiekt');
      } catch (err) { alert(err); draw.delete(f.id); }
    }
    drawingCategory = null;
    activeDraftFeature = null;
    clearDrawBtns();
    await load();
    if (createdId) {
      // Edycja opisu/zdjęć obiektów specjalnych odbywa się w osobnej stronie
      // admin_punkty_historyczne.html — tutaj tylko geometria.
      if (allFeatures[createdId]?.properties?.kategoria === 'obiekt_specjalny') {
        status('Dodano obiekt specjalny — edytuj opis i zdjęcia w menu "Punkty Historyczne"');
      } else {
        editGeometry(createdId);
        status('Dodano obiekt — możesz teraz przesunąć punkty i kliknąć Zapisz');
      }
    }
  });

  map.on('draw.update', () => {
    if (editingObjectId) status('Masz niezapisane zmiany — kliknij Zapisz');
  });

  // ---- Panel: kliknięcia ----
  $('search-filter').oninput = renderList;

  document.querySelectorAll('.tab-btn').forEach(b => b.onclick = () => {
    document.querySelectorAll('.tab-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    activeTab = b.dataset.tab;
    renderList();
  });

  $('parcel-list').onclick = e => {
    const li = e.target.closest('li');
    if (!li) return;
    const id = Number(li.dataset.id);
    const act = e.target.dataset.act;

    if (act === 'edit')      editGeometry(id);
    else if (act === 'rename') renameParcel(id);
    else if (act === 'type')   changeType(id);
    else if (act === 'delete') removeParcel(id);
    else {
      const f = allFeatures[id];
      if (!f) return;
      const bb = bboxGeom(f.geometry);
      if (bb) map.fitBounds(bb, { padding: 60, maxZoom: 19 });
      try { map.setFeatureState({ source:'parcels', id }, { hover:true }); } catch {}
      setTimeout(() => { try { map.setFeatureState({ source:'parcels', id }, { hover:false }); } catch {} }, 2000);
    }
  };

  $('delete-all-parcels-btn').onclick = async () => {
    if (!confirm('Usunąć wszystkie obiekty z mapy?')) return;
    await API._invoke('edytor_dzialek_usun_wszystkie');
    await load();
    status('Usunięto wszystkie obiekty');
  };

  // ---- Edycja geometrii ----
  function editGeometry(id) {
    const f = allFeatures[id];
    if (!f) return;
    drawingCategory = null;
    clearDrawBtns();
    $('draw-actions').style.display = 'none';
    draw.deleteAll();
    const feature = { type:'Feature', geometry: f.geometry, properties: { _editingId: id, kategoria: f.properties.kategoria } };
    const ids = draw.add(feature);
    editingObjectId = id;
    editingDrawFeatureId = ids[0];
    if (f.geometry?.type === 'Point') draw.changeMode('simple_select', { featureIds: [ids[0]] });
    else draw.changeMode('direct_select', { featureId: ids[0] });
    $('dynamic-actions').style.display = 'flex';
    $('dynamic-actions').innerHTML = `
      <span style="font-weight:600;color:var(--muted)">Tryb edycji — przeciągnij punkty/węzły</span>
      <button id="saveEditBtn" class="btn-secondary"><i class="fas fa-save"></i> Zapisz</button>
      <button id="cancelEditBtn" class="btn-secondary">Anuluj</button>`;
    $('saveEditBtn').onclick = saveEditGeometry;
    $('cancelEditBtn').onclick = async () => {
      draw.deleteAll();
      editingObjectId = null;
      editingDrawFeatureId = null;
      $('dynamic-actions').style.display = 'none';
      await load();
    };
  }

  async function saveEditGeometry() {
    if (!editingObjectId || !editingDrawFeatureId) return;
    const feature = draw.get(editingDrawFeatureId) || draw.getAll().features[0];
    if (!feature?.geometry) return alert('Nie znaleziono edytowanej geometrii.');
    try {
      await API._invoke('edytor_dzialek_aktualizuj_geometrie', { id: editingObjectId, geometria: feature.geometry });
      editingObjectId = null;
      editingDrawFeatureId = null;
      $('dynamic-actions').style.display = 'none';
      draw.deleteAll();
      await load();
      status('Zapisano geometrię');
    } catch (err) { alert(err); }
  }

  // ---- CRUD ----
  async function renameParcel(id) {
    const f = allFeatures[id];
    const n = prompt('Nowa nazwa/numer:', dispId(f));
    if (!n) return;
    await API._invoke('edytor_dzialek_zmien_nazwe', { id, nazwa: n.trim() });
    await load();
  }
  async function changeType(id) {
    const f = allFeatures[id];
    if (!f) return;
    const kind = geometryKind(f.geometry);
    const allowed = CATEGORY_OPTIONS.filter(o => o.kind === kind);
    if (!allowed.length) {
      alert('Nie można zmienić typu dla tej geometrii.');
      return;
    }

    // Nie pozwalamy zmienić geometrii liniowej/poligonowej na punktową itd.
    // Np. droga ma wiele punktów (linia), więc nie może stać się budynkiem,
    // kapliczką ani obiektem specjalnym, bo te typy są pojedynczym punktem.
    drawingCategory = null;
    clearDrawBtns();
    $('draw-actions').style.display = 'none';
    try { draw.deleteAll(); } catch {}

    $('dynamic-actions').style.display = 'flex';
    $('dynamic-actions').innerHTML = `
      <span style="font-weight:600;color:var(--muted)">Zmień typ:</span>
      <select id="typeSelect" style="padding:.6rem .8rem;border:1px solid var(--border);border-radius:8px;font-weight:600;background:white;color:var(--text)">
        ${allowed.map(o => `<option value="${o.value}" ${o.value === f.properties.kategoria ? 'selected' : ''}>${o.label}</option>`).join('')}
      </select>
      <button id="saveTypeBtn" class="btn-secondary"><i class="fas fa-save"></i> Zapisz typ</button>
      <button id="cancelTypeBtn" class="btn-secondary">Anuluj</button>`;

    $('saveTypeBtn').onclick = async () => {
      const n = $('typeSelect').value;
      if (!n) return;
      await API._invoke('edytor_dzialek_zmien_kategorie', { id, kategoria: n });
      $('dynamic-actions').style.display = 'none';
      await load();
      status('Zmieniono typ obiektu');
    };
    $('cancelTypeBtn').onclick = () => {
      $('dynamic-actions').style.display = 'none';
      status('Anulowano zmianę typu');
    };
  }
  async function removeParcel(id) {
    if (!confirm('Usunąć obiekt?')) return;
    await API._invoke('edytor_dzialek_usun_obiekt', { id });
    await load();
  }

  // ---- Backupy działek ----
  async function loadBackupList() {
    const list = $('backup-list');
    if (!list) return;
    list.innerHTML = '<li><span>Ładowanie...</span></li>';
    try {
      const res = await API._invoke('edytor_dzialek_backupy');
      const files = res.files || [];
      list.innerHTML = files.length ? files.map(f => {
        const name = f.filename || f;
        const meta = f.modified ? ` <small style="color:var(--muted)">${f.modified}</small>` : '';
        return `<li data-filename="${String(name).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;')}"><span title="${name}">${name}${meta}</span><div class="backup-actions"><button class="btn-restore">Przywróć</button><button class="btn-delete">Usuń</button></div></li>`;
      }).join('') : '<li><span>Brak kopii.</span></li>';
    } catch (err) {
      list.innerHTML = `<li><span>Błąd wczytywania: ${String(err?.message || err)}</span></li>`;
    }
  }

  $('open-backup-manager')?.addEventListener('click', async () => {
    $('backupModal')?.classList.add('open');
    await loadBackupList();
  });
  $('closeBackupModal')?.addEventListener('click', () => $('backupModal')?.classList.remove('open'));
  $('backupModal')?.addEventListener('click', e => { if (e.target.id === 'backupModal') $('backupModal')?.classList.remove('open'); });
  $('create-backup-btn')?.addEventListener('click', async () => {
    try {
      const res = await API._invoke('edytor_dzialek_utworz_backup');
      status(res?.message || 'Utworzono kopię zapasową');
      await loadBackupList();
    } catch (err) { alert('Błąd backupu: ' + (err?.message || err)); }
  });
  $('backup-list')?.addEventListener('click', async e => {
    const li = e.target.closest('li[data-filename]');
    if (!li) return;
    const filename = li.dataset.filename;
    if (e.target.classList.contains('btn-restore')) {
      if (!confirm(`Przywrócić backup "${filename}"?\n\nAktualne obiekty mapy zostaną nadpisane.`)) return;
      try {
        const res = await API._invoke('edytor_dzialek_przywroc_backup', { filename });
        status(res?.message || 'Przywrócono backup');
        await load();
        await loadBackupList();
      } catch (err) { alert('Błąd przywracania: ' + (err?.message || err)); }
    }
    if (e.target.classList.contains('btn-delete')) {
      if (!confirm(`Usunąć backup "${filename}"?`)) return;
      try {
        const res = await API._invoke('edytor_dzialek_usun_backup', { filename });
        status(res?.message || 'Usunięto kopię zapasową');
        await loadBackupList();
      } catch (err) { alert('Błąd usuwania: ' + (err?.message || err)); }
    }
  });

  // ---- Geometria: bbox ----
  function bboxGeom(g) {
    if (!g) return null;
    let min = [Infinity,Infinity], max = [-Infinity,-Infinity];
    const eat = ([x,y]) => { if(x<min[0])min[0]=x; if(y<min[1])min[1]=y; if(x>max[0])max[0]=x; if(y>max[1])max[1]=y; };
    if (g.type==='Point') return [[g.coordinates[0],g.coordinates[1]],[g.coordinates[0],g.coordinates[1]]];
    if (g.type==='LineString') g.coordinates.forEach(eat);
    else if (g.type==='MultiLineString') g.coordinates.forEach(l=>l.forEach(eat));
    else if (g.type==='Polygon') g.coordinates.forEach(r=>r.forEach(eat));
    else if (g.type==='MultiPolygon') g.coordinates.forEach(p=>p.forEach(r=>r.forEach(eat)));
    if (!Number.isFinite(min[0])) return null;
    return [[min[0],min[1]],[max[0],max[1]]];
  }

  // Wstrzykujemy kolory do properties przed setData (żeby warstwy mogły je odczytać)
  const origLoad = load;
  load = async function() {
    const fc = await API._invoke('api_dzialki');
    allFeatures = {};
    const features = fc.features || [];
    for (const f of features) allFeatures[f.id] = f;

    const geojson = { type:'FeatureCollection', features: features.map(f => {
      const cat = f.properties.kategoria || 'default';
      const c = colorFor(cat);
      const isLine = LINE_CATS.has(cat);
      const fillOp = ['las','pastwisko'].includes(cat) ? 0.5 : (cat==='obrys_miejscowosci' ? 0.04 : 0.35);
      return {
        type:'Feature', id: f.id, geometry: f.geometry,
        properties: {
          ...f.properties,
          _color: c,
          _fillOpacity: fillOp,
          _lineWidth: isLine ? (cat==='rzeka' ? 4 : 3) : 2,
        }
      };
    })};

    if (draw) draw.deleteAll();
    if (map.getSource('parcels')) map.getSource('parcels').setData(geojson);
    renderList();
  };
});
</script>
</body>
</html>
