  <style>
    :root{--primary-gradient:linear-gradient(135deg,#667eea 0%,#764ba2 100%);--primary-color:#667eea;--primary-dark:#5a67d8;--secondary-color:#764ba2;--success-color:#48bb78;--danger-color:#f56565;--bg-main:#f7fafc;--bg-card:#fff;--text-primary:#2d3748;--text-secondary:#718096;--text-light:#a0aec0;--border-color:#e2e8f0;--shadow-sm:0 1px 3px rgba(0,0,0,.12);--shadow-md:0 4px 6px rgba(0,0,0,.1);--shadow-lg:0 10px 15px rgba(0,0,0,.1);--radius:12px;--radius-sm:8px;--transition:all .25s cubic-bezier(.4,0,.2,1);--header-height:64px}body.dark-mode{--bg-main:#0f172a;--bg-card:#1f2937;--text-primary:#f3f4f6;--text-secondary:#e5e7eb;--text-light:#cbd5e1;--border-color:#374151}*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg-main);color:var(--text-primary);height:100vh;overflow:hidden;line-height:1.6}::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:var(--bg-card);border-radius:5px}::-webkit-scrollbar-thumb{background:linear-gradient(135deg,var(--primary-color),var(--secondary-color));border-radius:5px;border:2px solid var(--bg-card)}.background-gradient{position:fixed;inset:0;background:var(--primary-gradient);opacity:.05;z-index:-1}.app-container{display:flex;flex-direction:column;height:100%}.top-bar{height:var(--header-height);background:var(--bg-card);border-bottom:1px solid var(--border-color);display:flex;align-items:center;justify-content:space-between;padding:0 24px;box-shadow:var(--shadow-sm)}.brand{display:flex;align-items:center;gap:12px}.brand i{font-size:1.5rem;background:var(--primary-gradient);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}.brand h1{font-size:1.25rem;font-weight:700}.top-bar-info{display:flex;gap:.5rem;color:var(--text-secondary);font-size:.9rem}.controls{display:flex;gap:12px;align-items:center}.theme-btn{background:var(--bg-main);border:0;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-primary)}button,.btn-link{font-family:inherit}.btn-primary,.btn-success,.btn-danger,.btn-cancel,.btn-secondary{padding:.625rem 1.25rem;border:0;border-radius:var(--radius-sm);font-weight:600;cursor:pointer;transition:var(--transition);display:inline-flex;align-items:center;gap:.5rem;font-size:.9rem;text-decoration:none}.btn-primary{background:var(--primary-gradient);color:#fff}.btn-primary:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}.btn-success{background:var(--success-color);color:#fff}.btn-danger{background:var(--danger-color);color:#fff}.btn-cancel{background:#e2e8f0;color:#4a5568}.btn-secondary{background:transparent;border:1px solid var(--border-color);color:var(--text-primary)}.small{padding:.45rem .7rem;font-size:.8rem}.main-content{flex:1;overflow:hidden;padding:24px}.section.active{display:flex;flex-direction:column;height:100%}.section-header{margin-bottom:1.5rem;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}.section-header h2{font-size:1.5rem;font-weight:700;display:flex;align-items:center;gap:.75rem}.section-header h2 i{color:var(--primary-color)}.genealogy-layout{display:grid;grid-template-columns:380px 1fr;gap:0;flex:1;min-height:0;background:var(--bg-card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-lg)}.genealogy-sidebar{background:#f8fafc;color:#334155;display:flex;flex-direction:column;border-right:1px solid #e2e8f0;overflow:hidden}.dark-mode .genealogy-sidebar{background:#1e293b;color:#e2e8f0;border-right-color:#374151}.genealogy-search-box{padding:1rem;background:#f1f5f9;display:flex;align-items:center;gap:.75rem;border-bottom:1px solid #e2e8f0;flex-shrink:0}.dark-mode .genealogy-search-box{background:#0f172a;border-bottom-color:#374151}.genealogy-search-box i{color:#94a3b8}.genealogy-search-box input{flex:1;background:transparent;border:0;color:var(--text-primary);font-size:.9rem;outline:0}.genealogy-filters{padding:.75rem 1rem;display:flex;gap:.5rem;border-bottom:1px solid #e2e8f0;flex-shrink:0}.filter-btn{padding:.4rem .75rem;background:transparent;border:1px solid #cbd5e1;border-radius:20px;color:#64748b;font-size:.8rem;cursor:pointer}.filter-btn.active{background:var(--primary-gradient);border-color:transparent;color:#fff}.secondary-filters{padding:.75rem 1rem;display:flex;gap:10px;border-bottom:1px solid #e2e8f0}.mini-input{max-width:80px}.mini-input,.mini-select{padding:8px;border:1px solid var(--border-color);border-radius:6px;background:var(--bg-main);color:var(--text-primary);font-size:.85rem}.mini-select{flex:1}.genealogy-count{padding:.75rem 1rem;font-size:.8rem;text-transform:uppercase;letter-spacing:.5px;color:#64748b;border-bottom:1px solid #e2e8f0}.persons-list{flex:1;overflow-y:auto;padding:1rem}.person-list-item{padding:14px;border-radius:8px;margin-bottom:10px;background:var(--bg-main);border:1px solid transparent;cursor:pointer;transition:.2s;display:flex;justify-content:space-between;align-items:center}.person-list-item:hover{background:var(--bg-card);border-color:var(--primary-color);box-shadow:0 2px 4px rgba(0,0,0,.05)}.person-list-item.active{background:var(--primary-gradient);color:#fff}.person-list-item.active .person-name{color:#fff!important}.person-name{font-weight:600}.person-name.male{color:#3b82f6}.person-name.female{color:#ec4899}.person-details-mini{font-size:.85rem;color:var(--text-secondary);margin-top:2px}.person-id{font-size:.75rem;background:rgba(0,0,0,.05);padding:2px 6px;border-radius:4px;color:var(--text-secondary)}.genealogy-details{flex:1;background:var(--bg-card);padding:40px;overflow-y:auto;position:relative}.no-selection-placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;color:var(--text-secondary)}.no-selection-placeholder i{font-size:4rem;opacity:.3;margin-bottom:1.5rem}.no-selection-placeholder h3{font-size:1.5rem;margin-bottom:.5rem;color:var(--text-primary)}.detail-header{margin-bottom:40px;padding-bottom:24px;border-bottom:1px solid var(--border-color);display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:1rem}.person-title h1{font-size:2rem;margin-bottom:8px;display:flex;align-items:center;gap:16px;line-height:1.2}.gender-icon.fa-mars{color:#3b82f6}.gender-icon.fa-venus{color:#ec4899}.dates{font-size:1.2rem;color:var(--text-secondary)}.person-id-badge{font-size:.75rem;font-weight:500;background:var(--primary-gradient);color:#fff;padding:4px 10px;border-radius:20px;margin-left:12px}.detail-actions{display:flex;gap:.5rem;flex-wrap:wrap}.relation-group{margin-bottom:32px}.relation-group h3{font-size:.85rem;text-transform:uppercase;color:var(--text-secondary);margin-bottom:12px;letter-spacing:1px;font-weight:700}.modern-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}.modern-card{background:var(--bg-main);border:1px solid var(--border-color);border-radius:16px;padding:20px;cursor:pointer;transition:.2s}.modern-card:hover{border-color:var(--primary-color);transform:translateY(-2px);box-shadow:var(--shadow-md)}.card-role{font-size:.75rem;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;font-weight:700;color:var(--text-secondary)}.card-name{font-size:1.1rem;font-weight:700;margin-bottom:4px}.card-name.male{color:#3b82f6}.card-name.female{color:#ec4899}.card-dates{font-size:.9rem;color:var(--text-secondary)}.text-muted{color:var(--text-light);font-style:italic}.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;z-index:1000}.modal-overlay.hidden{display:none}.modal-content{background:var(--bg-card);border-radius:var(--radius);width:90%;max-width:800px;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 25px 50px rgba(0,0,0,.25)}.modal-header{padding:1.5rem;border-bottom:1px solid var(--border-color);display:flex;justify-content:space-between;align-items:center}.modal-close{background:0;border:0;font-size:1.5rem;color:var(--text-light);cursor:pointer;width:40px;height:40px}.modal-body{padding:1.5rem;flex:1;overflow-y:auto}.modal-footer{padding:1.5rem;border-top:1px solid var(--border-color);display:flex;justify-content:flex-end;gap:.75rem}.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1.5rem}.form-group{display:flex;flex-direction:column;margin-bottom:1rem}.form-group label{margin-bottom:.5rem;font-weight:500}.form-group input,.form-group textarea,.form-group select{width:100%;padding:.625rem;border:2px solid var(--border-color);border-radius:var(--radius-sm);font-family:inherit;font-size:.875rem;background:var(--bg-main);color:var(--text-primary)}.form-group textarea{resize:vertical;min-height:100px}.autocomplete-suggestions{position:absolute;top:100%;left:0;right:0;background:var(--bg-card);border:1px solid var(--border-color);border-radius:var(--radius-sm);max-height:200px;overflow-y:auto;z-index:100;box-shadow:var(--shadow-md)}.autocomplete-suggestions.hidden{display:none}.autocomplete-suggestion{padding:.75rem 1rem;cursor:pointer}.autocomplete-suggestion:hover{background:var(--bg-main)}.spouse-row{display:flex;gap:10px;margin-bottom:10px;align-items:center}.btn-remove-spouse{width:38px;height:38px;border:0;border-radius:6px;background:#f87171;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}.toast-container{position:fixed;top:80px;right:24px;z-index:2000}.toast{padding:1rem 1.5rem;border-radius:var(--radius-sm);margin-bottom:.75rem;color:#fff;box-shadow:var(--shadow-lg)}.toast.success{background:var(--success-color)}.toast.error{background:var(--danger-color)}.tree-dialog{width:95vw;max-width:1400px;height:85vh;border:0;border-radius:16px;padding:0;background:var(--bg-card);box-shadow:0 25px 50px rgba(0,0,0,.25);overflow:hidden;position:fixed;inset:0;margin:auto}.tree-dialog::backdrop{background:rgba(0,0,0,.6)}.tree-dialog-header{display:flex;justify-content:space-between;align-items:center;padding:1rem 1.5rem;background:var(--primary-gradient);color:white}.tree-container{padding:24px;overflow:auto;height:calc(85vh - 64px)}.tree-row{display:flex;gap:12px;justify-content:center;margin:20px 0;flex-wrap:wrap}.tree-node{min-width:190px;text-align:center;background:var(--bg-main);border:1px solid var(--border-color);border-radius:12px;padding:12px;cursor:pointer}@media(max-width:900px){.genealogy-layout{grid-template-columns:1fr}.genealogy-sidebar{height:45vh}.top-bar-info{display:none}}
  </style>
</head>
<body>
  <div class="background-gradient"></div>
  <div class="app-container">
    <header class="top-bar">
      <div class="brand"><i class="fas fa-sitemap"></i><h1>Edytor Genealogii</h1></div>
      <div class="top-bar-info"><span id="currentDate"></span><span id="currentTime" style="font-weight:600"></span></div>
      <div class="controls"><button id="themeToggle" class="theme-btn" title="Przełącz motyw"><i class="fas fa-moon"></i></button><a href="/index.html" class="btn-secondary"><i class="fas fa-home"></i> Start</a></div>
    </header>
    <main class="main-content"><section class="section active"><div class="section-header"><h2><i class="fas fa-sitemap"></i> Zarządzanie Genealogią</h2><button class="btn-primary" id="addGenealogyBtn"><i class="fas fa-plus"></i> Dodaj Osobę</button></div><div class="genealogy-layout"><div class="genealogy-sidebar"><div class="genealogy-search-box"><i class="fas fa-search"></i><input type="text" id="searchGenealogy" placeholder="Szukaj osoby, rocznika lub domu..."></div><div class="genealogy-filters"><button class="filter-btn active" data-filter="all">Wszyscy</button><button class="filter-btn" data-filter="male">Mężczyźni</button><button class="filter-btn" data-filter="female">Kobiety</button></div><div class="secondary-filters"><input type="text" id="filterHouse" placeholder="Dom" class="mini-input"><select id="sortFilter" class="mini-select"><option value="az">A-Z</option><option value="za">Z-A</option><option value="id_asc">ID rosnąco</option><option value="id_desc">ID malejąco</option></select></div><div class="genealogy-count">ZNALEZIONO: <strong id="totalCount">0</strong></div><div class="persons-list" id="personsListContainer"><div class="loader">Ładowanie...</div></div></div><div class="genealogy-details" id="personDetailsPanel"><div class="no-selection-placeholder"><i class="fas fa-user-friends"></i><h3>Wybierz osobę z listy</h3><p>Kliknij na osobę po lewej stronie, aby zobaczyć szczegóły, edytować dane lub wyświetlić drzewo.</p></div></div></div></section></main>
  </div>
  <div id="genealogyModal" class="modal-overlay hidden"><div class="modal-content"><div class="modal-header"><h2 id="modalTitle">Edycja Osoby</h2><button class="modal-close" id="modalClose">&times;</button></div><div class="modal-body" id="modalBody"></div><div class="modal-footer"><button class="btn-success" id="modalSave"><i class="fas fa-save"></i> Zapisz</button><button class="btn-cancel" id="modalCancel">Anuluj</button></div></div></div>
  <dialog id="treeDialog" class="tree-dialog"><div class="tree-dialog-header"><h2>Drzewo Genealogiczne</h2><button id="closeTreeBtn" class="modal-close" style="color:white">&times;</button></div><div id="treeContainer" class="tree-container"></div></dialog>
  <div class="toast-container" id="toastContainer"></div>
  <script>
  let allPeople=[],filteredPeople=[],currentPerson=null,allProtocols=[];const $=id=>document.getElementById(id);const els={list:$('personsListContainer'),details:$('personDetailsPanel'),search:$('searchGenealogy'),house:$('filterHouse'),sort:$('sortFilter'),count:$('totalCount'),modal:$('genealogyModal'),modalBody:$('modalBody'),modalTitle:$('modalTitle'),modalSave:$('modalSave'),tree:$('treeDialog'),treeContainer:$('treeContainer')};const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const num=v=>{v=String(v??'').trim();return v===''?null:Number(v)};function toast(type,msg){const t=document.createElement('div');t.className='toast '+type;t.textContent=msg;$('toastContainer').appendChild(t);setTimeout(()=>t.remove(),3000)}function setupClock(){const u=()=>{const n=new Date();$('currentDate').textContent=n.toLocaleDateString('pl-PL',{weekday:'long',year:'numeric',month:'long',day:'numeric'});$('currentTime').textContent=n.toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'})};u();setInterval(u,1000)}
  async function loadData(){try{els.list.innerHTML='<div class="loader">Pobieranie danych...</div>';allPeople=(await API.genealogia.pobierzEditor()).map(p=>({...p,marriages:p.marriages||[]}));allProtocols=await API.protokoly.lista();filterData();if(currentPerson){const p=allPeople.find(x=>String(x.id_osoby)===String(currentPerson.id_osoby));p?showDetails(p):placeholder('Osoba usunięta')}}catch(e){console.error(e);toast('error','Nie udało się pobrać genealogii');els.list.innerHTML='<div class="error">Błąd pobierania danych</div>'}}
  function saveAll(){return API.genealogia.zapiszEditor(allPeople)}function full(p){return `${p.imie||''} ${p.nazwisko||''}`.trim()}function getP(id){return id?allPeople.find(p=>String(p.id_osoby)===String(id)):null}function filterData(){const q=els.search.value.toLowerCase(),h=els.house.value.trim(),f=document.querySelector('.filter-btn.active').dataset.filter;filteredPeople=allPeople.filter(p=>{const txt=`${full(p)} ${p.rok_urodzenia||''} ${p.id_osoby}`.toLowerCase();return txt.includes(q)&&(!h||String(p.numer_domu||'').includes(h))&&(f==='all'||(f==='male'&&p.plec==='M')||(f==='female'&&p.plec==='F'))});sortData();renderList()}function sortData(){const t=els.sort.value;filteredPeople.sort((a,b)=>{if(t==='id_asc')return Number(a.id_osoby)-Number(b.id_osoby);if(t==='id_desc')return Number(b.id_osoby)-Number(a.id_osoby);const an=(a.imie||'').toLowerCase(),bn=(b.imie||'').toLowerCase();return t==='az'?an.localeCompare(bn):bn.localeCompare(an)})}function renderList(){els.count.textContent=filteredPeople.length;els.list.innerHTML=filteredPeople.length?'':'<div style="padding:10px;text-align:center;color:#888">Brak wyników</div>';filteredPeople.slice(0,500).forEach(p=>{const el=document.createElement('div');el.className='person-list-item'+(currentPerson&&String(currentPerson.id_osoby)===String(p.id_osoby)?' active':'');const years=(p.rok_urodzenia||p.rok_smierci)?`${p.rok_urodzenia||'?'} - ${p.rok_smierci||'?'}`:'';el.innerHTML=`<div class="person-info"><div class="person-name ${p.plec==='M'?'male':'female'}">${esc(full(p))}</div><div class="person-details-mini">${esc(years)} ${p.numer_domu?`🏠 ${esc(p.numer_domu)}`:''}</div></div><div class="person-id">ID: ${esc(p.id_osoby)}</div>`;el.onclick=()=>showDetails(p);els.list.appendChild(el)})}
  function placeholder(h){els.details.innerHTML=`<div class="no-selection-placeholder"><i class="fas fa-user-friends"></i><h3>${esc(h)}</h3></div>`}function relCard(id,role){const p=getP(id);if(!p)return `<div class="modern-card"><div class="card-role">${esc(role)}</div><div class="card-name">ID ${esc(id)}</div><div class="card-dates">Nie znaleziono</div></div>`;return `<div class="modern-card" onclick="goToPerson('${esc(p.id_osoby)}')"><div class="card-role">${esc(role)}</div><div class="card-name ${p.plec==='M'?'male':'female'}">${esc(full(p))}</div><div class="card-dates">${esc(p.rok_urodzenia||'?')} - ${esc(p.rok_smierci||'?')}</div></div>`}
  function showDetails(person){currentPerson=person;renderList();const father=getP(person.id_ojca),mother=getP(person.id_matki);const siblings=allPeople.filter(p=>String(p.id_osoby)!==String(person.id_osoby)&&((person.id_ojca&&String(p.id_ojca)===String(person.id_ojca))||(person.id_matki&&String(p.id_matki)===String(person.id_matki))));const children=allPeople.filter(p=>String(p.id_ojca)===String(person.id_osoby)||String(p.id_matki)===String(person.id_osoby));const spouses=(person.marriages||[]).map(m=>m.spouseId||m.spouse_json_id).filter(Boolean);const years=(person.rok_urodzenia||person.rok_smierci)?`(${person.rok_urodzenia||'?'} - ${person.rok_smierci||'?'})`:'';els.details.innerHTML=`<div class="detail-header"><div class="person-title"><h1><i class="fas ${person.plec==='M'?'fa-mars':'fa-venus'} gender-icon"></i> ${esc(full(person))} <span class="person-id-badge">ID: ${esc(person.id_osoby)}</span></h1><div class="dates">${esc(years)}</div>${person.numer_domu?`<div style="margin-top:5px"><strong>Dom:</strong> ${esc(person.numer_domu)}</div>`:''}${person.uwagi?`<div style="margin-top:10px;font-style:italic">"${esc(person.uwagi)}"</div>`:''}</div><div class="detail-actions"><button class="btn-primary" onclick="openEditModal(currentPerson)"><i class="fas fa-edit"></i> Edytuj</button>${person.protokol_klucz?`<button class="btn-secondary" onclick="location.href='/wlasciciele/protokol.html?ownerId=${encodeURIComponent(person.protokol_klucz)}'"><i class="fas fa-file-alt"></i> Protokół</button>`:''}<button class="btn-secondary" onclick="showTree(currentPerson)"><i class="fas fa-sitemap"></i> Drzewo</button><button class="btn-secondary" style="color:var(--danger-color);border-color:var(--danger-color)" onclick="deletePerson(currentPerson.id_osoby)"><i class="fas fa-trash"></i> Usuń</button></div></div><div class="detail-grid"><div class="relation-group"><h3><i class="fas fa-users"></i> RODZINA</h3></div><div class="relation-group"><h3>RODZICE</h3><div class="modern-grid">${father?relCard(father.id_osoby,'OJCIEC'):''}${mother?relCard(mother.id_osoby,'MATKA'):''}${!father&&!mother?'<div class="text-muted">Brak danych</div>':''}</div></div><div class="relation-group"><h3>MAŁŻONKOWIE</h3><div class="modern-grid">${spouses.length?spouses.map(id=>relCard(id,'MAŁŻONEK')).join(''):'<div class="text-muted">Brak małżeństw</div>'}</div></div><div class="relation-group"><h3>DZIECI (${children.length})</h3><div class="modern-grid">${children.sort((a,b)=>(a.rok_urodzenia||0)-(b.rok_urodzenia||0)).map(c=>relCard(c.id_osoby,'DZIECKO')).join('')||'<div class="text-muted">Brak dzieci w bazie</div>'}</div></div>${siblings.length?`<div class="relation-group"><h3>RODZEŃSTWO (${siblings.length})</h3><div class="modern-grid">${siblings.map(s=>relCard(s.id_osoby,'RODZEŃSTWO')).join('')}</div></div>`:''}</div>`}
  window.goToPerson=id=>{const p=getP(id);if(p)showDetails(p)};function openEditModal(person){els.modalTitle.textContent=person?`Edycja: ${full(person)}`:'Dodaj Nową Osobę';const nextId=allPeople.reduce((m,p)=>Math.max(m,Number(p.id_osoby)||0),0)+1;const p=person||{id_osoby:nextId,plec:'M',marriages:[]};els.modalBody.innerHTML=`<form id="genealogyForm"><div class="form-grid"><div class="form-group"><label>ID Osoby (Unikalne)</label><input type="number" name="id_osoby" id="idOsobyInput" value="${esc(p.id_osoby)}" required><small style="color:var(--text-secondary);margin-top:4px">⚠️ Zmiana ID może wpłynąć na powiązania rodzinne</small></div></div><div class="form-grid"><div class="form-group"><label>Imię</label><input type="text" name="imie" value="${esc(p.imie||'')}" required></div><div class="form-group"><label>Nazwisko</label><input type="text" name="nazwisko" value="${esc(p.nazwisko||'')}" required></div></div><div class="form-grid"><div class="form-group"><label>Płeć</label><select name="plec"><option value="M" ${p.plec==='M'?'selected':''}>Mężczyzna</option><option value="F" ${p.plec==='F'?'selected':''}>Kobieta</option></select></div><div class="form-group"><label>Nr Domu</label><input type="text" name="numer_domu" value="${esc(p.numer_domu||'')}"></div></div><div class="form-grid"><div class="form-group"><label>Rok urodzenia</label><input type="number" name="rok_urodzenia" value="${esc(p.rok_urodzenia||'')}"></div><div class="form-group"><label>Rok śmierci</label><input type="number" name="rok_smierci" value="${esc(p.rok_smierci||'')}"></div></div><div class="form-grid"><div class="form-group"><label>Ojciec</label><div style="position:relative"><input type="hidden" name="id_ojca" id="fatherIdInput" value="${esc(p.id_ojca||'')}"><input type="text" id="fatherAutocomplete" placeholder="Wpisz imię..." autocomplete="off"><div id="fatherSuggestions" class="autocomplete-suggestions hidden"></div></div></div><div class="form-group"><label>Matka</label><div style="position:relative"><input type="hidden" name="id_matki" id="motherIdInput" value="${esc(p.id_matki||'')}"><input type="text" id="motherAutocomplete" placeholder="Wpisz imię..." autocomplete="off"><div id="motherSuggestions" class="autocomplete-suggestions hidden"></div></div></div></div><div class="form-group"><label>Małżonkowie</label><div id="spousesContainer"></div><button type="button" class="btn-secondary small" id="addSpouseBtn">+ Dodaj małżonka</button></div><div class="form-group"><label>Protokół</label><div style="position:relative"><input type="hidden" name="protokol_klucz" id="protokolIdInput" value="${esc(p.protokol_klucz||'')}"><input type="text" id="protokolAutocomplete" placeholder="Wpisz numer L.p. lub nazwę właściciela..." autocomplete="off"><div id="protokolSuggestions" class="autocomplete-suggestions hidden"></div></div><small style="color:var(--text-secondary);margin-top:4px">Wpisz numer lub nazwę aby wyszukać protokół</small></div><div class="form-group"><label>Uwagi</label><textarea name="uwagi" rows="3">${esc(p.uwagi||'')}</textarea></div></form>`;setupAutocomplete('fatherAutocomplete','fatherIdInput','fatherSuggestions','M');setupAutocomplete('motherAutocomplete','motherIdInput','motherSuggestions','F');prefillPerson('fatherAutocomplete',p.id_ojca);prefillPerson('motherAutocomplete',p.id_matki);setupSpouses(p);setupProtocol(p);els.modal.classList.remove('hidden');els.modalSave.onclick=()=>saveModal(person)}
  function prefillPerson(input,id){const p=getP(id);if(p)$(input).value=`${full(p)} (ID:${p.id_osoby})`}function setupAutocomplete(inputId,hiddenId,suggId,gender,hiddenRef){const input=$(inputId),hidden=hiddenRef||$(hiddenId),box=$(suggId);input.oninput=()=>{const v=input.value.toLowerCase().trim();box.innerHTML='';if(!v){box.classList.add('hidden');if(hidden)hidden.value='';return}let ms=allPeople.filter(p=>`${full(p)} ${p.id_osoby}`.toLowerCase().includes(v));if(gender)ms=ms.filter(p=>p.plec===gender);ms.slice(0,10).forEach(p=>{const d=document.createElement('div');d.className='autocomplete-suggestion';d.innerHTML=`<strong>${esc(full(p))}</strong> (ID: ${esc(p.id_osoby)})`;d.onclick=()=>{input.value=`${full(p)} (ID:${p.id_osoby})`;if(hidden)hidden.value=p.id_osoby;box.classList.add('hidden')};box.appendChild(d)});box.classList.toggle('hidden',!box.children.length)}}function setupSpouses(p){const c=$('spousesContainer');function row(sid){const r=document.createElement('div');r.className='spouse-row';const u=Date.now()+Math.random();const sp=getP(sid);r.innerHTML=`<div style="position:relative;flex:2"><input type="hidden" class="spouse-id" value="${esc(sid||'')}"><input type="text" id="sac_${u}" value="${sp?esc(full(sp)+` (ID:${sp.id_osoby})`):''}" placeholder="Imię małżonka..." autocomplete="off"><div id="ssug_${u}" class="autocomplete-suggestions hidden"></div></div><button type="button" class="btn-remove-spouse" onclick="this.parentElement.remove()"><i class="fas fa-times"></i></button>`;c.appendChild(r);setupAutocomplete(`sac_${u}`,null,`ssug_${u}`,null,r.querySelector('.spouse-id'))}$('addSpouseBtn').onclick=()=>row();(p.marriages||[]).forEach(m=>row(m.spouseId||m.spouse_json_id))}function setupProtocol(p){const input=$('protokolAutocomplete'),hidden=$('protokolIdInput'),box=$('protokolSuggestions');const cur=allProtocols.find(x=>String(x.klucz)===String(p.protokol_klucz));if(cur)input.value=`L.p. ${cur.numer_protokolu||''} - ${cur.nazwa}`;input.oninput=()=>{const v=input.value.toLowerCase().trim();box.innerHTML='';if(!v){hidden.value='';box.classList.add('hidden');return}allProtocols.filter(pr=>`${pr.numer_protokolu||''} ${pr.nazwa||''} ${pr.klucz||''}`.toLowerCase().includes(v)).slice(0,10).forEach(pr=>{const d=document.createElement('div');d.className='autocomplete-suggestion';d.innerHTML=`<strong>L.p. ${esc(pr.numer_protokolu||'')}</strong> - ${esc(pr.nazwa||'')}`;d.onclick=()=>{input.value=`L.p. ${pr.numer_protokolu||''} - ${pr.nazwa}`;hidden.value=pr.klucz;box.classList.add('hidden')};box.appendChild(d)});box.classList.toggle('hidden',!box.children.length)}}
  async function saveModal(original){const form=$('genealogyForm');if(!form.checkValidity()){form.reportValidity();return}const fd=new FormData(form),data=Object.fromEntries(fd.entries());const newId=Number(data.id_osoby),oldId=original?Number(original.id_osoby):null;if(newId!==oldId&&allPeople.some(p=>Number(p.id_osoby)===newId)){toast('error',`ID ${newId} jest już zajęte`);return}const person={id_osoby:newId,imie:data.imie.trim(),nazwisko:data.nazwisko.trim(),plec:data.plec,numer_domu:data.numer_domu||'',rok_urodzenia:num(data.rok_urodzenia),rok_smierci:num(data.rok_smierci),id_ojca:num(data.id_ojca),id_matki:num(data.id_matki),protokol_klucz:data.protokol_klucz||'',uwagi:data.uwagi||'',marriages:[...document.querySelectorAll('.spouse-row')].map(r=>num(r.querySelector('.spouse-id').value)).filter(Boolean).map(id=>({spouse_json_id:id,spouseId:id}))};if(original){const i=allPeople.findIndex(p=>String(p.id_osoby)===String(original.id_osoby));allPeople[i]=person;allPeople.forEach(p=>{if(Number(p.id_ojca)===oldId)p.id_ojca=newId;if(Number(p.id_matki)===oldId)p.id_matki=newId;(p.marriages||[]).forEach(m=>{if(Number(m.spouse_json_id||m.spouseId)===oldId){m.spouse_json_id=newId;m.spouseId=newId}})})}else allPeople.push(person);try{await saveAll();els.modal.classList.add('hidden');toast('success','Zapisano osobę');await loadData();showDetails(getP(newId))}catch(e){console.error(e);toast('error','Błąd zapisu')}}async function deletePerson(id){const p=getP(id);if(!p||!confirm(`Usunąć osobę: ${full(p)}?`))return;allPeople=allPeople.filter(x=>String(x.id_osoby)!==String(id));allPeople.forEach(x=>{if(String(x.id_ojca)===String(id))x.id_ojca=null;if(String(x.id_matki)===String(id))x.id_matki=null;x.marriages=(x.marriages||[]).filter(m=>String(m.spouse_json_id||m.spouseId)!==String(id))});try{await saveAll();currentPerson=null;toast('success','Usunięto osobę');await loadData()}catch(e){toast('error','Błąd usuwania')}}function showTree(p){const parents=[getP(p.id_ojca),getP(p.id_matki)].filter(Boolean);const spouses=(p.marriages||[]).map(m=>getP(m.spouseId||m.spouse_json_id)).filter(Boolean);const children=allPeople.filter(x=>String(x.id_ojca)===String(p.id_osoby)||String(x.id_matki)===String(p.id_osoby));const node=(x,role='')=>`<div class="tree-node ${x.plec==='M'?'male':'female'}" onclick="treeDialog.close();goToPerson('${esc(x.id_osoby)}')"><div class="card-role">${esc(role)}</div><strong>${esc(full(x))}</strong><div>${esc(x.rok_urodzenia||'?')} - ${esc(x.rok_smierci||'?')}</div></div>`;els.treeContainer.innerHTML=`<div class="tree-row">${parents.map(x=>node(x,'Rodzic')).join('')||'<span class="text-muted">Brak rodziców</span>'}</div><div class="tree-row">${node(p,'Wybrana osoba')} ${spouses.map(x=>node(x,'Małżonek')).join('')}</div><div class="tree-row">${children.map(x=>node(x,'Dziecko')).join('')||'<span class="text-muted">Brak dzieci</span>'}</div>`;els.tree.showModal()}window.openEditModal=openEditModal;window.deletePerson=deletePerson;window.showTree=showTree;document.addEventListener('DOMContentLoaded',()=>{setupClock();$('themeToggle').onclick=()=>{document.body.classList.toggle('dark-mode');$('themeToggle').innerHTML=document.body.classList.contains('dark-mode')?'<i class="fas fa-sun"></i>':'<i class="fas fa-moon"></i>'};$('addGenealogyBtn').onclick=()=>openEditModal(null);$('modalClose').onclick=$('modalCancel').onclick=()=>els.modal.classList.add('hidden');$('closeTreeBtn').onclick=()=>els.tree.close();els.search.oninput=els.house.oninput=filterData;els.sort.onchange=filterData;document.querySelectorAll('.filter-btn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');filterData()});loadData()});
  </script>
